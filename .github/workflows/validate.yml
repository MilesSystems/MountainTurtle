name: Validate macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Validate shell scripts
        run: bash -n scripts/build.sh scripts/fetch-sparkle.sh scripts/prepare-release.sh scripts/publish-release.sh
      - name: Run service and native helper tests
        run: python3 -m unittest discover -s tests -v
      - name: Build both Mac architectures
        env:
          TARGET_ARCHS: arm64 x86_64
        run: scripts/build.sh
      - name: Verify app and embedded updater
        run: |
          codesign --verify --deep --strict 'build/Mountain Turtle.app'
          lipo -verify_arch arm64 x86_64 'build/Mountain Turtle.app/Contents/MacOS/Mountain Turtle'
          test -L 'build/Mountain Turtle.app/Contents/Frameworks/Sparkle.framework/Versions/Current'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' 'build/Mountain Turtle.app/Contents/Info.plist')" = "$(cat VERSION)"
          git diff --exit-code

# CI validates the source and universal build without accessing release keys.
# Publication is a separate local prepare-release.sh / publish-release.sh step.
